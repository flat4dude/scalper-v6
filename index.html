<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated 86% Kalshi Gold Scalper</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-gold: #f2ca30;
            --status-standby: #e3b341;
            --status-alert: #f85149;
            --signal-up: #2ea043;
            --signal-down: #f85149;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .terminal-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin: 0 0 4px 0;
        }

        .header h2 {
            font-size: 1rem;
            color: var(--accent-gold);
            margin: 0 0 14px 0;
            letter-spacing: 1px;
        }

        .status-badge {
            display: block;
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-standby {
            background-color: rgba(227, 179, 65, 0.15);
            color: var(--status-standby);
            border: 1px solid rgba(227, 179, 65, 0.3);
        }

        .status-triggered {
            background-color: rgba(248, 81, 73, 0.2);
            color: var(--status-alert);
            border: 1px solid var(--status-alert);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .system-rule {
            background-color: rgba(248, 81, 73, 0.05);
            border: 1px dashed rgba(248, 81, 73, 0.3);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #ff7b72;
            margin: 15px 0;
        }

        .data-display-box {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .control-row {
            display: flex;
            align-items: center;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .num-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            text-align: right;
            padding-right: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: monospace;
            width: 100%;
            height: 44px;
            box-sizing: border-box;
        }

        .num-input:focus {
            outline: none;
            background-color: #1f242c;
        }

        .label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .value-stream {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: monospace;
            color: #fff;
        }

        .signal-block {
            text-align: center;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        .signal-up-state {
            background-color: rgba(46, 160, 67, 0.15);
            color: #56d364;
            border-color: rgba(46, 160, 67, 0.4);
        }

        .signal-down-state {
            background-color: rgba(248, 81, 73, 0.15);
            color: #ff7b72;
            border-color: rgba(248, 81, 73, 0.4);
        }

        .auto-pulse-indicator {
            font-size: 0.75rem;
            color: #58a6ff;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 15px;
            font-style: italic;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="header">
        <h1>Automated 86% Kalshi Gold Scalper</h1>
        <h2>🏆 KXGOLD15M 86% Auto</h2>
        <div id="statusIndicator" class="status-badge status-standby">
            ● Standby WAITING FOR WINDOW
        </div>
    </div>

    <div class="system-rule">
        🔥 SYSTEM AUTOMATED: Alert opens at 5:00 left if Premium hits 86%+
    </div>
